    m.bindPopup(box);
    all.push([p.lat, p.lng]);
  });

  function fit() {
    if (all.length) { map.fitBounds(L.latLngBounds(all), { padding: [30, 30] }); }
    else { map.setView([20.5937, 78.9629], 5); }
  }
  fit();
  document.getElementById('fit').addEventListener('click', fit);
})();
</script>
</body>
</html>
