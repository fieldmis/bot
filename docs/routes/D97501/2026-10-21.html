  var b = document.createElement('b');
  b.textContent = D.userId + '  •  ' + D.date;
  title.appendChild(b);
  var sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = D.distanceKm.toFixed(1) + ' km  •  ' + D.points.length + ' points' +
                    (D.note ? '  (' + D.note + ')' : '');
  bar.appendChild(title);
  bar.appendChild(sub);

  var map = L.map('map', { zoomControl: true, maxZoom: 19 });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors — route via OSRM'
  }).addTo(map);

  var all = [];
  if (D.route.length >= 2) {
    var latlngs = D.route.map(function (c) { return [c[1], c[0]]; });
    L.polyline(latlngs, { color: '#2b6cb0', weight: 5, opacity: 0.85 }).addTo(map);
    all = all.concat(latlngs);
  }

  var n = D.points.length;
  D.points.forEach(function (p, i) {
    var num = i + 1;
    var color = num === 1 ? '#22a34d' : (num === n ? '#d92b2b' : '#2b6cb0');
    var icon = L.divIcon({
      className: '',
      html: '<div class="pin" style="background:' + color + '">' + num + '</div>',
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -14]
    });
    var m = L.marker([p.lat, p.lng], {
      icon: icon,
      zIndexOffset: (num === 1 || num === n) ? 1000 : 0
    }).addTo(map);

    var box = document.createElement('div');
    var h = document.createElement('b');
    h.textContent = '#' + num + (num === 1 ? ' (start)' : (num === n ? ' (end)' : ''));
    box.appendChild(h);
    if (p.time) {
      var t = document.createElement('div');
      t.className = 'pop-t';
      t.textContent = p.time;
      box.appendChild(t);
    }
    if (p.address) {
      var a = document.createElement('div');
      a.className = 'pop-a';
      a.textContent = p.address;
      box.appendChild(a);
    }
    m.bindPopup(box);
    all.push([p.lat, p.lng]);
  });

  function fit() {
    if (all.length) { map.fitBounds(L.latLngBounds(all), { padding: [30, 30] }); }
    else { map.setView([20.5937, 78.9629], 5); }
  }
  fit();
  document.getElementById('fit').addEventListener('click', fit);
})();
</script>
</body>
</html>
